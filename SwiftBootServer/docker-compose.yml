version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: swiftboot-postgres
    environment:
      POSTGRES_USER: swiftboot
      POSTGRES_PASSWORD: swiftboot
      POSTGRES_DB: swiftboot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiftboot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Cache & Job Queue)
  redis:
    image: redis:7-alpine
    container_name: swiftboot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vapor App (Development)
