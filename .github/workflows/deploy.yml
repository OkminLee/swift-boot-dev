# SwiftBoot CI/CD 파이프라인
# Backend: Fly.io 자동 배포
# Frontend: Cloudflare Pages 자동 배포 (별도 설정 필요 없음)

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  # ==========================================
  # Backend 테스트 및 배포
  # ==========================================
  backend:
    name: Backend (Vapor)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SwiftBootServer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PR에서는 빌드만, main에서는 배포까지
      - name: Setup Fly.io
        if: github.ref == 'refs/heads/main'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        if: github.ref == 'refs/heads/main'
        run: flyctl deploy --remote-only

  # ==========================================
  # Frontend 빌드 테스트
  # ==========================================
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: swiftboot-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: swiftboot-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.swiftboot.dev/api/v1
          NEXT_PUBLIC_GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}

      # Cloudflare Pages는 GitHub 연동으로 자동 배포됨
      # 수동 배포가 필요한 경우 아래 주석 해제
      # - name: Deploy to Cloudflare Pages
      #   if: github.ref == 'refs/heads/main'
      #   uses: cloudflare/wrangler-action@v3
      #   with:
      #     apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #     accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      #     command: pages deploy .next --project-name=swiftboot

  # ==========================================
  # E2E 테스트 (선택사항)
  # ==========================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend]
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: swiftboot-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: swiftboot-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: swiftboot-web/playwright-report/
          retention-days: 7
